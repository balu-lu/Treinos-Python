name: FastAPI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 2.3.2
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/poetry" --version

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Run tests with pytest
        run: poetry run pytest -v --cov=APIs --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build-and-test-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t api-livros:latest .

      - name: Start Services with Docker Compose
        run: docker compose up -d --no-build

      - name: Wait for API to be ready
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8000/livros >/dev/null; then
              echo "API is ready"
              exit 0
            fi

            echo "Attempt ${attempt}/30 failed, retrying in 5 seconds..."
            sleep 5
          done

          echo "API did not become ready in time"
          docker compose logs
          exit 1

      - name: Smoke Test - Check API Endpoint
        run: |
          response_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/livros)
          echo "HTTP Response Code: $response_code"
          if [ "$response_code" != "200" ]; then
            echo "Health check failed! Expected 200, got $response_code"
            exit 1
          fi
          echo "Health check passed!"

      - name: Show Docker Logs (on failure)
        if: failure()
        run: |
          echo "=== Docker Compose Logs ===="
          docker compose logs

      - name: Cleanup - Stop services
        if: always()
        run: |
          docker compose down
          echo "Services cleaned up"
