name: FastAPI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Install project
      run: poetry install --no-interaction

    - name: Run tests with pytest
      run: poetry run pytest -v --cov=APIs --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build-and-test-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t api-livros:latest .
      env:
        DOCKER_BUILDKIT: 1

    - name: Start Services with Docker Compose
      run: |
        docker-compose up -d
        echo "Waiting for services to be ready..."
        sleep 10

    - name: Install curl for health check
      run: |
        apt-get update
        apt-get install -y curl
        rm -rf /var/lib/apt/lists/*

    - name: Smoke Test - Check API Endpoint
      run: |
        response_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/livros)
        echo "HTTP Response Code: $response_code"
        if [ "$response_code" != "200" ]; then
          echo "❌ Health check failed! Expected 200, got $response_code"
          exit 1
        fi
        echo "✅ Health check passed!"

    - name: Show Docker Logs (on failure)
      if: failure()
      run: |
        echo "=== Docker Compose Logs ===="
        docker-compose logs

    - name: Cleanup - Stop services
      if: always()
      run: |
        docker-compose down
        echo "✅ Services cleaned up"
