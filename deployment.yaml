apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-livros-deployment
  labels:
    app: api-livros
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-livros
  template:
    metadata:
      labels:
        app: api-livros
    spec:
      containers:
        - name: api-livros
          image: api-livros:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "0"
