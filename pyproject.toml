[tool.poetry]
name = "api-livros"
version = "0.1.0"
description = "FastAPI application for books management with Redis caching"
authors = ["balu <daniel.pf.chs@gmail.com>"]
packages = [{ include = "APIs" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.136.1"
uvicorn = {extras = ["standard"], version = "^0.46.0"}
sqlalchemy = "^2.0.49"
redis = "^5.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]
